<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Bombay Pizza Club - Order Pizza Online</title>

    <meta
      name="description"
      content="Order delicious pizza, burgers, ice cream and more from Bombay Pizza Club. Fast delivery, secure online ordering, and a great food experience."
    />

    <meta
      name="keywords"
      content="Bombay Pizza Club, Pizza, Burger, Ice Cream, Food Delivery, Online Food Order, Restaurant"
    />

    <meta name="author" content="Bombay Pizza Club" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://bombay-pizza-club.vercel.app/"
    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bombay Pizza Club" />
    <meta property="og:title" content="Bombay Pizza Club - Order Pizza Online" />
    <meta
      property="og:description"
      content="Order delicious pizza, burgers, ice cream and more from Bombay Pizza Club."
    />
    <meta
      property="og:url"
      content="https://bombay-pizza-club.vercel.app/"
    />

    <!-- Update this later with your real logo -->
    <meta
      property="og:image"
      content="https://bombay-pizza-club.vercel.app/vite.svg"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Bombay Pizza Club - Order Pizza Online"
    />
    <meta
      name="twitter:description"
      content="Order delicious pizza, burgers, ice cream and more from Bombay Pizza Club."
    />
    <meta
      name="twitter:image"
      content="https://bombay-pizza-club.vercel.app/vite.svg"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ff6b00" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Bombay Pizza Club",
        "url": "https://bombay-pizza-club.vercel.app/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </body>
</html>
